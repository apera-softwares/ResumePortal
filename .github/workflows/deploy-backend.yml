name: 'Backend CI/CD with Portainer'

on: 
  push: 
    branches:
      - 'release-backend/**'

jobs: 
  deploy: 
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
 
      - name: 'Login to Forgejo Container Registry'
        uses: 'docker/login-action@v3'
        with:
          registry: 'registry.aperasoftwares.com'
          username: '${{ secrets.FORGEJO_USERNAME }}'
          password: '${{ secrets.FORGEJO_TOKEN }}'

      - name: 'Build and Push Docker Image'
        uses: 'docker/build-push-action@v6'
        with:
          context: './Backend'
          push: true
          no-cache: true
          tags: 'registry.aperasoftwares.com/aperra-org/resumebuilder-backend:latest'

      - name: 'Portainer Deploy'
        uses: 'cssnr/portainer-stack-deploy-action@v1'
        timeout-minutes: 15
        with:
          name: 'resumebuilder-backend'
          type: 'file'
          file: 'Backend/docker-compose.yml'
          url: '${{ secrets.PORTAINER_HOST }}'
          token: '${{ secrets.PORTAINER_TOKEN }}'
          ref: "" 
          standalone: true
          prune: true
          pull: true
          env_data: |
            {
               "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
               "PORT": "8094",
               "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
               "PUPPETEER_EXECUTABLE_PATH": "${{ secrets.PUPPETEER_EXECUTABLE_PATH }}"
            }
