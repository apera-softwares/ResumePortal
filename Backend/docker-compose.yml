version: "3.8"
# Deploy trigger: 2026-06-23T12:24:53Z
services:
  resumebuilder-backend:
    image: registry.aperasoftwares.com/aperra-org/resumebuilder-backend:latest
    container_name: resumebuilder-backend-latest
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      PORT: "8094"
      JWT_SECRET: "${JWT_SECRET}"
      PUPPETEER_EXECUTABLE_PATH: "${PUPPETEER_EXECUTABLE_PATH}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      USE_S3: "${USE_S3}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      ACCESS_KEY_ID: "${ACCESS_KEY_ID}"
      SECRET_ACCESS_KEY: "${SECRET_ACCESS_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ACCOUNT_ID: "${S3_ACCOUNT_ID}"
    volumes:
      - resumebuilder-uploads:/usr/src/app/uploads
    networks:
      - resumebuilder-network

volumes:
  resumebuilder-uploads:
    name: resumebuilder-uploads

networks:
  resumebuilder-network:
    name: resumebuilder-network
    external: true
